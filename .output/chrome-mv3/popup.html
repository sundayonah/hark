<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="manifest.type" content="browser_action">
    <title>Hark</title>
    <script type="module" crossorigin src="/chunks/popup-YgMiVgTT.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/popup-BHQOwiEB.css">
  </head>
  <body>
    <main class="w-80 bg-fog p-4 text-pine">
      <header class="flex items-center justify-between">
        <div class="flex items-center gap-2.5">
          <div id="wave" class="wave flex h-6 items-center gap-[3px]" aria-hidden="true">
            <span></span><span></span><span></span><span></span><span></span>
          </div>
          <h1 class="text-xl font-semibold tracking-tight">Hark</h1>
        </div>

        <div id="toggleWrap">
        <label class="relative inline-flex cursor-pointer items-center" title="Read emails aloud">
          <input id="enabled" type="checkbox" role="switch" class="peer sr-only">
          <span class="h-6 w-11 rounded-full bg-line transition-colors peer-checked:bg-pine peer-focus-visible:ring-2 peer-focus-visible:ring-glow peer-focus-visible:ring-offset-2"></span>
          <span class="absolute left-0.5 top-0.5 h-5 w-5 rounded-full bg-white shadow-sm transition-transform peer-checked:translate-x-5 peer-checked:bg-glow"></span>
          <span class="sr-only">Read emails aloud</span>
        </label>
        </div>
      </header>

      <!-- Shown until a Gmail account is connected -->
      <section id="view-connect" class="mt-6 hidden">
        <p class="text-base font-medium leading-snug">Hear your important emails instead of watching for them.</p>
        <p class="mt-2 text-sm text-sage">Connect a Gmail account and Hark will read out new messages from the senders you pick.</p>
        <button id="connect" class="mt-5 w-full rounded-lg bg-pine py-2.5 text-sm font-medium text-fog transition hover:bg-pine/90 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-glow">
          Connect Gmail
        </button>
        <p id="connectError" class="mt-3 hidden text-sm text-red-700"></p>
      </section>

      <!-- Shown once connected -->
      <section id="view-main" class="hidden">
        <p id="account" class="mt-2 truncate text-sm font-medium"></p>
        <p id="status" class="text-sm text-sage"></p>

        <div class="mt-5">
          <label for="senderInput" class="mb-1 block text-sm font-medium">Read emails from</label>
          <div class="flex gap-2">
            <input id="senderInput" type="text" spellcheck="false" autocomplete="off" placeholder="mercor.com or name@mercor.com" class="min-w-0 flex-1 rounded-lg border border-line bg-white px-3 py-2 text-sm outline-none placeholder:text-sage/60 focus:border-pine focus:ring-2 focus:ring-glow/50">
            <button id="addSender" class="rounded-lg bg-pine px-3 text-sm font-medium text-fog transition hover:bg-pine/90 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-glow">
              Add
            </button>
          </div>
          <ul id="senders" class="mt-2 flex flex-wrap gap-1.5"></ul>
          <p id="senderEmpty" class="mt-2 text-sm text-sage">No senders yet. Add one to start listening.</p>
        </div>

        <div class="mt-4">
          <div class="mb-1 flex items-baseline justify-between">
            <label for="rate" class="text-sm font-medium">Speed</label>
            <output id="rateOut" class="text-sm tabular-nums text-sage">1.0×</output>
          </div>
          <input id="rate" type="range" min="0.7" max="1.6" step="0.1" class="w-full accent-pine">
        </div>

        <fieldset class="mt-4">
          <legend class="mb-1 text-sm font-medium">How much to read</legend>
          <div class="grid grid-cols-2 rounded-lg bg-line/60 p-0.5 text-sm">
            <label class="cursor-pointer">
              <input type="radio" name="mode" value="short" class="peer sr-only">
              <span class="block rounded-md py-1.5 text-center text-sage transition peer-checked:bg-white peer-checked:font-medium peer-checked:text-pine peer-checked:shadow-sm peer-focus-visible:ring-2 peer-focus-visible:ring-glow">Subject and intro</span>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="mode" value="full" class="peer sr-only">
              <span class="block rounded-md py-1.5 text-center text-sage transition peer-checked:bg-white peer-checked:font-medium peer-checked:text-pine peer-checked:shadow-sm peer-focus-visible:ring-2 peer-focus-visible:ring-glow">Whole email</span>
            </label>
          </div>
        </fieldset>

        <div class="mt-5 flex gap-2">
          <button id="test" class="flex-1 rounded-lg border border-pine/25 py-2 text-sm font-medium transition hover:bg-white focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-glow">Test voice</button>
          <button id="switch" class="flex-1 rounded-lg border border-pine/25 py-2 text-sm font-medium transition hover:bg-white focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-glow">Switch account</button>
        </div>
        <button id="disconnect" class="mt-3 w-full text-center text-sm text-sage underline-offset-2 hover:underline">Disconnect</button>
      </section>
    </main>
  </body>
</html>
